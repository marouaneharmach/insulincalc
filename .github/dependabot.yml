version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # React et ses typages doivent toujours être mis à jour ensemble (versions identiques exigées).
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['@types/react', '@types/react-dom']
        update-types: ['minor', 'patch']
      runtime:
        dependency-type: production
        exclude-patterns: ['react', 'react-dom']
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint ne supporte pas encore TypeScript 7 ni ESLint 10 : majeures ignorées jusqu'à nouvel ordre.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
